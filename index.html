<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Niddah Calculator · מחשבון נדה</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2430;--mute:#6b7280;--line:#e5e1d8;--accent:#2f5d8a;--accent-ink:#fff;--warn-bg:#fff4e0;--warn-ink:#7a4a00;--ok:#2e7d4f;--tag:#e8eef6}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--ink:#e8e9ec;--mute:#9aa1ad;--line:#2c323c;--accent:#6aa3da;--accent-ink:#0d1620;--warn-bg:#3a2d14;--warn-ink:#f1c27a;--ok:#6fcf97;--tag:#24303f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew",Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
h1{font-size:1.4rem;margin:0}
h2{font-size:1.05rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.disc{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:10px 12px;font-size:.9rem;margin:8px 0}
label{display:block;font-size:.85rem;color:var(--mute);margin:8px 0 3px}
input,select,button{font:inherit}
input[type=date],input[type=time],input[type=number],input[type=text],select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.seg label{min-width:150px}
.res{display:block;width:100%;text-align:start;margin:6px 0}
.times{font-size:.9rem}
.q{background:var(--tag);color:var(--accent);border:0;border-radius:999px;min-width:26px;height:26px;padding:0 6px;font-size:.85rem;margin-inline-start:4px;vertical-align:middle}
.gl{background:var(--tag);border-radius:10px;padding:10px 12px;margin:6px 0;font-size:.92rem}
.gl>div{margin:4px 0 8px}
.gl-item{padding:9px 0;border-bottom:1px solid var(--line)}
.gl-item:last-child{border-bottom:0}
.gl-item>div{font-size:.92rem;margin-top:2px}
.seg label{flex:1;margin:0;display:flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;color:var(--ink);font-size:1rem}
button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:var(--accent);color:var(--accent-ink);font-weight:600}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
button.small{padding:5px 9px;font-size:.85rem}
button.danger{background:transparent;color:#c0392b;border:1px solid var(--line)}
.timeline{list-style:none;padding:0;margin:0}
.timeline li{padding:9px 0;border-bottom:1px solid var(--line)}
.timeline li:last-child{border-bottom:0}
.k{font-size:.82rem;color:var(--mute)}
.v{font-weight:600}
.sub{font-size:.9rem;color:var(--mute)}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:.9rem}
.tag{display:inline-block;background:var(--tag);color:var(--accent);border-radius:999px;padding:1px 9px;font-size:.78rem;margin-inline-start:6px}
.hist{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.hist.sel{font-weight:700}
.hist:last-child{border-bottom:0}
details summary{cursor:pointer;font-weight:600}
.lang button{padding:6px 10px}
.foot{font-size:.8rem;color:var(--mute);text-align:center;margin:18px 0}
:root{--cal-clean:#dff1e5}
@media (prefers-color-scheme:dark){:root{--cal-clean:#1f3a2a}}
.calh{display:flex;align-items:center;gap:8px;margin-top:6px}
.calh .t{flex:1;text-align:center;font-weight:700}
.calh button{padding:6px 12px}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}
.calw{font-size:.75rem;color:var(--mute);text-align:center;padding:2px 0}
button.cald{min-height:56px;min-width:0;border:1px solid var(--line);border-radius:6px;padding:3px 4px;background:var(--card);color:var(--ink);font:inherit;font-size:.85rem;text-align:start;display:flex;flex-direction:column;gap:1px;cursor:pointer}
button.cald .h{font-size:.65rem;color:var(--mute)}
div.cald.blank{min-height:0}
button.cald.sh{background:var(--tag)}
button.cald.clean{background:var(--cal-clean)}
button.cald.today{outline:2px solid var(--accent)}
button.cald.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:auto}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.period{background:#c0392b}.dot.hefsek{background:#2f6fb0}.dot.mikvah{background:#8e44ad}.dot.onah{background:#e67e22}.dot.clean{background:#3d9a5f}
.cal-legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:.78rem;color:var(--mute)}
.cal-det{margin-top:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:.9rem}
#report{display:none}
@media print{
 body{background:#fff!important;color:#000!important}
 body>*:not(#report){display:none!important}
 #report{display:block;font:11.5pt/1.45 "Noto Sans Hebrew",Arial,sans-serif;color:#000}
 #report h1{font-size:20pt;margin:0 0 2pt}
 #report .rsub{color:#444;margin-bottom:8pt}
 #report h2{font-size:13pt;margin:14pt 0 4pt;border-bottom:1px solid #888;padding-bottom:2pt}
 #report table{border-collapse:collapse;width:100%;margin:4pt 0;page-break-inside:auto}
 #report tr{page-break-inside:avoid}
 #report th,#report td{border:1px solid #bbb;padding:4pt 6pt;text-align:start;vertical-align:top}
 #report .rkv th{width:36%;background:#f0f0f0}
 #report thead th{background:#f0f0f0}
 #report p{margin:4pt 0}
 #report .warn{background:none;color:#000;border:1px solid #888;border-radius:4px}
 #report .note{font-size:9.5pt;color:#444}
 @page{margin:16mm}
}

<body>
<div class="wrap" id="app"></div>
<div id="report"></div>
<script>
/* Niddah calculation logic. Pure functions, no DOM. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.NiddahLogic = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  const DAY = 86400000;

  // ---------- date helpers (UTC noon, so no DST problems) ----------
  function parseISO(s) {
    const [y, m, d] = s.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d, 12));
  }
  function toISO(dt) { return dt.toISOString().slice(0, 10); }
  function addDays(dt, n) { return new Date(dt.getTime() + n * DAY); }
  function diffDays(a, b) { return Math.round((a.getTime() - b.getTime()) / DAY); }

  // ---------- Hebrew calendar via Intl ----------
  const hebEn = new Intl.DateTimeFormat('en-u-ca-hebrew-nu-latn',
    { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
  function hebParts(dt) {
    const p = {};
    hebEn.formatToParts(dt).forEach(x => { p[x.type] = x.value; });
    return { day: parseInt(p.day, 10), month: p.month, year: p.relatedYear || p.year };
  }
  function hebFormat(dt, lang) {
    const loc = lang === 'he' ? 'he-u-ca-hebrew' : 'en-u-ca-hebrew-nu-latn';
    return new Intl.DateTimeFormat(loc,
      { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }).format(dt);
  }
  function civilFormat(dt, lang) {
    return new Intl.DateTimeFormat(lang === 'he' ? 'he-IL' : 'en-GB',
      { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }).format(dt);
  }
  function weekday(dt) { return dt.getUTCDay(); } // 0 = Sunday ... 5 = Friday, 6 = Shabbat

  // ---------- period model ----------
  // period = { onsetISO, night: bool, bein?: bool, hefsekISO?: string, hefsekAfterSunset?: bool }
  // Halachic day begins at sunset: an onset seen at night belongs to the next civil date.
  // bein = seen from sunset up to BEIN_MIN minutes after it (bein hashmashos). The reference
  // sefer (ch.5 s.3) counts that day as day 1, so it keeps the same civil date; a stringent
  // view (Rav Wosner) does not, and purityPlan reports that alternative.
  const BEIN_MIN = 18;
  function halachicDate(p) {
    const d = parseISO(p.onsetISO);
    return p.night ? addDays(d, 1) : d;
  }
  function onah(p) { return p.night ? 'night' : 'day'; }

  // The minimum-days setting is a number (day 1 = day of onset). Legacy strings still work.
  function minDaysOf(m) {
    if (typeof m === 'number') return m;
    return m === 'seph' ? 4 : 5;
  }

  // Is the night that begins on the evening of civil date D a night when tevilah is not allowed?
  // Yom Kippur (10 Tishrei) and the Tisha B'Av fast (9 Av, or 10 Av when 9 Av is Shabbat).
  function fastNight(eveningDate) {
    const n = addDays(eveningDate, 1);
    const hp = hebParts(n);
    if (hp.month === 'Tishri' && hp.day === 10) return 'yomKippur';
    if (hp.month === 'Av') {
      const wd = weekday(n);
      if (hp.day === 9 && wd !== 6) return 'tishaBav';
      if (hp.day === 10 && wd === 0) return 'tishaBav';
    }
    return null;
  }

  // ---------- purity count ----------
  // Day 1 = halachic day of onset. The sefer: at least 5 days (day of onset + 4) before the
  // 7 clean days, so hefsek taharah is no earlier than day 5 (some Sephardim wait longer;
  // 4 only on a Rav's instruction), and the setting is a number of days.
  // Hefsek is done in the afternoon before sunset; the 7 clean days start the next day;
  // mikvah is on the night after the 7th clean day (evening of civil hefsek date + 7).
  function purityPlan(p, minhag, _noAlt) {
    const H0 = halachicDate(p);
    const minDay = minDaysOf(minhag);
    const earliestHefsek = addDays(H0, minDay - 1);
    const warnings = [];
    let alt = null;
    if (p.bein && !_noAlt) {
      warnings.push('beinHashmashos');
      const a = purityPlan({ onsetISO: p.onsetISO, night: true }, minhag, true);
      alt = { earliestHefsek: a.earliestHefsek, mikvahEvening: a.mikvahEvening };
    }
    let hefsek = earliestHefsek;
    let actualEntered = false;
    if (p.hefsekISO) {
      actualEntered = true;
      hefsek = parseISO(p.hefsekISO);
      if (diffDays(hefsek, earliestHefsek) < 0) warnings.push('hefsekTooEarly');
      if (p.hefsekAfterSunset) {
        warnings.push('hefsekAfterSunset');
        // ch.6 s.11: a hefsek after sunset counts as if done the next day,
        // so the 7 clean days begin the day after that.
        hefsek = addDays(hefsek, 1);
      }
    }
    if (weekday(hefsek) === 5) warnings.push('hefsekErevShabbat');
    const firstClean = addDays(hefsek, 1);
    const lastClean = addDays(hefsek, 7);
    const mikvahEvening = lastClean; // civil date whose evening (after nightfall) is the mikvah night
    if (weekday(mikvahEvening) === 5) warnings.push('mikvahShabbat');
    if (weekday(mikvahEvening) === 6) warnings.push('mikvahMotzeiShabbat');
    const fn = fastNight(mikvahEvening);
    if (fn === 'yomKippur') warnings.push('mikvahYK');
    if (fn === 'tishaBav') warnings.push('mikvahTB');
    return {
      day1: H0, earliestHefsek, hefsek, actualEntered,
      firstClean, lastClean, mikvahEvening, warnings, alt,
    };
  }

  // ---------- onot / vesatot ----------
  // Same Hebrew day next month. Sefer ch.18 s.2: a period seen on the 30th is kept on the 30th of
  // the next month that has one (if the next month has only 29 days, the 30th "in two months").
  function nextMonthSameDay(H) {
    const hp = hebParts(H);
    for (let i = 27; i <= 33; i++) {
      const d = addDays(H, i), dp = hebParts(d);
      if (dp.day === hp.day && dp.month !== hp.month) return { date: d, note: null };
    }
    if (hp.day === 30) {
      for (let i = 34; i <= 100; i++) {
        const d = addDays(H, i), dp = hebParts(d);
        if (dp.day === 30 && dp.month !== hp.month) return { date: d, note: 'day30' };
      }
      // very rare run of short months: fall back to the 1st of the following month
      for (let i = 28; i <= 34; i++) {
        const d = addDays(H, i);
        if (hebParts(d).day === 1) return { date: d, note: 'day30' };
      }
    }
    return null;
  }

  function sortedPeriods(periods) {
    return periods.slice().sort((a, b) => halachicDate(a) - halachicDate(b));
  }

  function kavuaHaflagah(list, K) {
    if (list.length < K + 1) return null;
    const iv = [];
    for (let i = 1; i < list.length; i++) iv.push(diffDays(halachicDate(list[i]), halachicDate(list[i - 1])));
    const lastK = iv.slice(-K);
    const sameOnah = list.slice(-(K + 1)).every(p => onah(p) === onah(list[list.length - 1]));
    return lastK.every(x => x === lastK[0]) && sameOnah ? lastK[0] : null;
  }

  function kavuaYomHachodesh(list, K) {
    if (list.length < K) return false;
    const lastK = list.slice(-K);
    const day0 = hebParts(halachicDate(lastK[0])).day;
    for (let i = 0; i < lastK.length; i++) {
      if (hebParts(halachicDate(lastK[i])).day !== day0) return false;
      if (onah(lastK[i]) !== onah(lastK[0])) return false;
      if (i > 0) {
        const gap = diffDays(halachicDate(lastK[i]), halachicDate(lastK[i - 1]));
        if (gap < 28 || gap > 31) return false;
      }
    }
    return true;
  }

  function nextKavuaDate(d) { const r = nextMonthSameDay(d); return r ? r.date : null; }

  // An established veset hachodesh stays in force until it is uprooted: K months in a row at its
  // time without her seeing (sefer ch.16 s.11). Returns { day, onah, next, miss } or null.
  function activeKavuaChodesh(list, K) {
    let est = -1;
    for (let i = K - 1; i < list.length; i++) if (kavuaYomHachodesh(list.slice(0, i + 1), K)) est = i;
    if (est < 0) return null;
    const o = onah(list[est]);
    const day = hebParts(halachicDate(list[est])).day;
    let T = nextKavuaDate(halachicDate(list[est]));
    let miss = 0;
    for (let j = est + 1; j < list.length; j++) {
      const Hj = halachicDate(list[j]), oj = onah(list[j]);
      while (T && (T < Hj || (T.getTime() === Hj.getTime() && oj !== o))) { miss++; T = nextKavuaDate(T); }
      if (T && T.getTime() === Hj.getTime() && oj === o) { miss = 0; T = nextKavuaDate(T); }
    }
    if (miss >= K || !T) return null;
    return { day, onah: o, next: T, miss };
  }

  // Established veset haflagah (same gap K times). Uprooted after K gaps that do not match.
  function activeKavuaHaflagah(list, K) {
    let est = -1, I = null;
    for (let i = K; i < list.length; i++) {
      const v = kavuaHaflagah(list.slice(0, i + 1), K);
      if (v !== null && v > 0) { est = i; I = v; }
    }
    if (est < 0) return null;
    const o = onah(list[est]);
    let miss = 0;
    for (let j = est + 1; j < list.length; j++) {
      const d = diffDays(halachicDate(list[j]), halachicDate(list[j - 1]));
      if (d === I && onah(list[j]) === o) miss = 0; else miss++;
    }
    if (miss >= K) return null;
    return { interval: I, onah: o, next: addDays(halachicDate(list[list.length - 1]), I), miss };
  }

  // Projects the onot to watch after the period at index `idx` of the sorted list.
  //  - an established veset (kavua) that is still in force: only it is kept (sefer ch.17 s.1),
  //    plus the ordinary ones for a new sighting that was off her veset; no onat beinonit then
  //  - no kavua: yom hachodesh, haflagah, onat beinonit (day 30, optionally 31) of the last period,
  //    and earlier vesatot whose time has not come yet (ch.18 s.1 and s.4)
  function projectOnot(periods, idx, settings) {
    const list = sortedPeriods(periods).slice(0, idx + 1);
    const cur = list[list.length - 1];
    const H = halachicDate(cur);
    const o = onah(cur);
    const K = settings.kavuaTimes || 3;
    const both = settings.beinonitBoth !== false;
    const out = [];

    const kc = activeKavuaChodesh(list, K), kh = activeKavuaHaflagah(list, K);
    const anyKavua = !!(kc || kh);
    const lastGap = list.length >= 2 ? diffDays(H, halachicDate(list[list.length - 2])) : 0;
    const kcMatch = !kc || (hebParts(H).day === kc.day && o === kc.onah);
    const khMatch = !kh || (lastGap === kh.interval && o === kh.onah);
    const onlyKavua = anyKavua && kcMatch && khMatch;

    if (kc) out.push({ kind: 'kavuaChodesh', date: kc.next, onah: kc.onah, kavua: true, note: null });
    if (kh) out.push({ kind: 'kavuaHaflagah', date: kh.next, onah: kh.onah, kavua: true, interval: kh.interval });

    if (!onlyKavua) {
      const ym = nextMonthSameDay(H);
      if (ym) out.push({ kind: 'yomHachodesh', date: ym.date, onah: o, note: ym.note, kavua: false });
      if (!anyKavua) {
        out.push({ kind: 'onat30', date: addDays(H, 29), onah: both ? 'both' : o });
        if (settings.include31 !== false) out.push({ kind: 'onat31', date: addDays(H, 30), onah: both ? 'both' : o });
      }
      if (lastGap > 0) out.push({ kind: 'haflagah', date: addDays(H, lastGap), onah: o, interval: lastGap, kavua: false });

      // earlier vesatot of a woman with no kavua that were not yet reached (so not uprooted)
      for (let k = 0; k < list.length - 1; k++) {
        const Hk = halachicDate(list[k]), ok = onah(list[k]);
        const ymk = nextMonthSameDay(Hk);
        if (ymk && ymk.date > H) out.push({ kind: 'yomHachodeshEarlier', date: ymk.date, onah: ok, note: ymk.note });
        if (k >= 1) {
          const I = diffDays(Hk, halachicDate(list[k - 1]));
          if (I > 0) {
            const d = addDays(Hk, I);
            if (d > H) out.push({ kind: 'haflagahEarlier', date: d, onah: ok, interval: I });
          }
        }
      }
    }

    // drop duplicates (same family, same date and onah); keep the first, sort by date
    const fam = { yomHachodesh: 'c', yomHachodeshEarlier: 'c', kavuaChodesh: 'c', haflagah: 'h', haflagahEarlier: 'h', kavuaHaflagah: 'h', onat30: 'b30', onat31: 'b31' };
    const seen = new Set(), res = [];
    out.forEach(x => {
      const key = fam[x.kind] + '|' + toISO(x.date) + '|' + x.onah;
      if (!seen.has(key)) { seen.add(key); res.push(x); }
    });
    return res.sort((a, b) => a.date - b.date);
  }

  // For an onah on halachic date X: the night onah begins at sunset on civil X-1.
  function onahStartCivil(date, o) { return (o === 'night' || o === 'both') ? addDays(date, -1) : date; }

  // ---------- sunset (NOAA/Almanac approximation, ~1-2 min accuracy) ----------
  const rad = Math.PI / 180, deg = 180 / Math.PI;
  function dayOfYear(dt) {
    const start = Date.UTC(dt.getUTCFullYear(), 0, 0);
    return Math.floor((dt.getTime() - start) / DAY);
  }
  function sunTimeUTC(dateISO, lat, lon, rising) {
    const dt = parseISO(dateISO);
    const N = dayOfYear(dt);
    const lngHour = lon / 15;
    const t = N + ((rising ? 6 : 18) - lngHour) / 24;
    const M = 0.9856 * t - 3.289;
    let L = M + 1.916 * Math.sin(M * rad) + 0.020 * Math.sin(2 * M * rad) + 282.634;
    L = ((L % 360) + 360) % 360;
    let RA = deg * Math.atan(0.91764 * Math.tan(L * rad));
    RA = ((RA % 360) + 360) % 360;
    RA += Math.floor(L / 90) * 90 - Math.floor(RA / 90) * 90;
    RA /= 15;
    const sinDec = 0.39782 * Math.sin(L * rad);
    const cosDec = Math.cos(Math.asin(sinDec));
    const cosH = (Math.cos(90.833 * rad) - sinDec * Math.sin(lat * rad)) / (cosDec * Math.cos(lat * rad));
    if (cosH > 1 || cosH < -1) return null; // the sun does not rise or set that day
    const H = (rising ? 360 - deg * Math.acos(cosH) : deg * Math.acos(cosH)) / 15;
    const T = H + RA - 0.06571 * t - 6.622;
    const UT = (((T - lngHour) % 24) + 24) % 24;
    const dayStart = Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth(), dt.getUTCDate());
    let ms = dayStart + UT * 3600000;
    const noonUTC = dayStart + (12 - lngHour) * 3600000; // local solar noon, roughly
    if (rising) { while (ms > noonUTC) ms -= DAY; while (ms < noonUTC - DAY) ms += DAY; }
    else { while (ms < noonUTC) ms += DAY; while (ms > noonUTC + DAY) ms -= DAY; }
    return new Date(ms);
  }
  function sunsetUTC(dateISO, lat, lon) { return sunTimeUTC(dateISO, lat, lon, false); }
  function sunriseUTC(dateISO, lat, lon) { return sunTimeUTC(dateISO, lat, lon, true); }
  function fmtTime(date, tz, lang) {
    return new Intl.DateTimeFormat(lang === 'he' ? 'he-IL' : 'en-GB',
      { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: tz }).format(date);
  }

  return {
    parseISO, toISO, addDays, diffDays, hebParts, hebFormat, civilFormat, weekday,
    halachicDate, onah, purityPlan, projectOnot, sortedPeriods, onahStartCivil, fastNight, BEIN_MIN,
    nextMonthSameDay, kavuaHaflagah, kavuaYomHachodesh, activeKavuaChodesh, activeKavuaHaflagah, sunsetUTC, sunriseUTC, fmtTime,
  };
});

</script>
<script>
(function(){
const L = NiddahLogic;

  dh:'המקווה הוא הבריכה לטבילה. הטבילה היא טבילה מלאה שבה כל הגוף והשיער מתחת למים. עושים אותה בלילה, אחרי שהיום השביעי נגמר, והיא מסיימת את מצב הנדה.'},
 mikvahNight:{e:'Mikvah night (ליל טבילה)',h:'ליל טבילה',
  de:'The first night after the 7 clean days are over. It is right to immerse that night unless it is not possible. If it falls on Shabbat, Yom Kippur or Tisha B’Av there are special rules, and the app shows a warning.',
  dh:'הלילה הראשון אחרי שבעת הנקיים. כדאי לטבול באותו לילה, אלא אם אי אפשר. אם הוא חל בשבת, ביום כיפור או בתשעה באב יש דינים מיוחדים, והאפליקציה מזהירה.'},
 onah:{e:'Onah (עונה)',h:'עונה',
  de:'A half-day period: the night (from sunset until sunrise) or the day (from sunrise until sunset). The law notes which onah a period began in, because the next expected times are kept by onah.',
  dh:'חצי יום: הלילה (משקיעה עד הנץ החמה) או היום (מהנץ החמה עד השקיעה). ההלכה רושמת באיזו עונה התחילה הראיה, כי את הזמנים הבאים שומרים לפי עונות.'},
 veset:{e:'Veset / onot (וסת, עונות)',h:'וסת ועונות',
  de:'The times when a woman expects her next period. At those times she and her husband keep apart as a precaution, as her Rav explains. The app shows them as “days to be careful”.',
  dh:'הזמנים שבהם אשה מצפה לראיה הבאה. בזמנים אלה בני הזוג נפרדים לשם זהירות, כפי שמסביר מורה ההוראה. האפליקציה מציגה אותם כ"עונות לשמירה".'},
 vesetKavua:{e:'Established veset (וסת קבוע)',h:'וסת קבוע',
  de:'A pattern that repeated enough times in a row to count as fixed: the same Hebrew date three months in a row, or the same number of days between periods three times in a row. An established veset stays in force until it is uprooted: three times in a row at its time without her seeing. While it is in force only the established veset is kept. The number of times can be changed in Settings. Ask your Rav.',
  dh:'דפוס שחזר מספיק פעמים ברצף כדי להיחשב קבוע: אותו תאריך עברי שלושה חודשים ברצף, או אותו מרווח ימים בין ראיות שלוש פעמים ברצף. וסת קבוע נשאר בתוקף עד שנעקר: שלוש פעמים ברצף בזמנו בלי שראתה. כל עוד הוא בתוקף שומרים רק אותו. אפשר לשנות את המספר בהגדרות. יש לשאול מורה הוראה.'},
 yomHachodesh:{e:'Yom hachodesh (יום החודש)',h:'יום החודש',
  de:'The same Hebrew date as when the last period started, in the next month. For example, if it started on the 10th of the Hebrew month, the 10th of next month is a day to be careful. If it started on the 30th and next month has only 29 days, the sefer says to keep the 30th of the following month.',
  dh:'אותו תאריך עברי שבו התחילה הראיה האחרונה, בחודש הבא. למשל: התחילה בעשירי לחודש העברי, ולכן העשירי בחודש הבא הוא יום לשמירה. אם התחילה ב-30 ובחודש הבא יש רק 29 ימים, לפי הספר שומרים את יום 30 בחודש שאחריו.'},
 haflagah:{e:'Haflagah (הפלגה)',h:'הפלגה',
  de:'The same number of days between periods as last time. For example, if the last two periods began 29 days apart, count another 29 days from the last start.',
  dh:'אותו מספר ימים בין ראיה לראיה כמו בפעם הקודמת. למשל: שתי הראיות האחרונות התחילו בהפרש של 29 ימים, ולכן סופרים עוד 29 ימים מהראיה האחרונה.'},
 onat:{e:'Day 30 and day 31 (עונה בינונית)',h:'יום 30 ויום 31',
  de:'Counting the first day of the last period as day 1, day 30 is a day to be careful even if there is no pattern. Some are careful for the whole date (the night and the day), and some say it is day 31, so by default the app keeps both days, night and day. You can change this in Settings.',
  dh:'כשסופרים את היום הראשון של הראיה האחרונה כיום 1, יום 30 הוא יום לשמירה גם אם אין דפוס. יש השומרים את כל התאריך (הלילה והיום), ויש אומרים שזה יום 31; לכן ברירת המחדל באפליקציה שומרת את שני הימים, לילה ויום. אפשר לשנות בהגדרות.'},
 ketem:{e:'Ketem (כתם)',h:'כתם',
  de:'A stain of blood found on clothing, bedding or the body. Whether it makes her niddah depends on its colour, size and where it was found. The app cannot decide this. Show it to a Rav.',
  dh:'כתם דם שנמצא על בגד, על מצעים או על הגוף. אם הוא מטמא תלוי בצבע, בגודל ובמקום שבו נמצא. האפליקציה לא יכולה להחליט זאת. יש להראות אותו למורה הוראה.'},
 rav:{e:'Rav / Mora Hora’ah (רב, מורה הוראה)',h:'רב ומורה הוראה',
  de:'A rabbi who has studied the laws of family purity and can answer questions about them. The app only does the calendar; the Rav decides what is allowed.',
  dh:'רב שלמד את דיני טהרת המשפחה ויכול לענות על שאלות. האפליקציה עושה רק את חישוב התאריכים; הרב קובע מה מותר.'},
 minhag:{e:'Minhag (מנהג)',h:'מנהג',
  de:'A family or community custom, for example how many days to wait before the clean check. If you are not sure, ask your Rav which custom to follow.',
  dh:'נוהג של משפחה או קהילה, למשל כמה ימים ממתינים לפני הפסק טהרה. אם לא בטוחים, שואלים את הרב איזה מנהג לקיים.'},
 shabbatTerms:{e:'Erev Shabbat and Motzei Shabbat (ערב שבת, מוצאי שבת)',h:'ערב שבת ומוצאי שבת',
  de:'Erev Shabbat is Friday, before Shabbat begins. Motzei Shabbat is Saturday night, after Shabbat has ended.',
  dh:'ערב שבת הוא יום שישי, לפני שהשבת נכנסת. מוצאי שבת הוא ליל ראשון, אחרי שהשבת יצאה.'},
 fastDays:{e:'Yom Kippur and Tisha B’Av (יום כיפור, תשעה באב)',h:'יום כיפור ותשעה באב',
  de:'Fast days. According to the sefer, immersion in the mikvah is not allowed on the night a fast begins, so the app tells her to wait one more night.',
  dh:'ימי צום. לפי הספר, בלילה שבו מתחיל הצום אסור לטבול במקווה, ולכן האפליקציה אומרת לחכות עוד לילה.'}
};

let S = load();
let locResults=[], locMsg='', locQueryText='', locCoordsOpen=false, glossOpen={};
function detectLang(){let l='en';try{l=String((navigator.languages&&navigator.languages[0])||navigator.language||'en').toLowerCase();}catch(_){}return (l.startsWith('he')||l.startsWith('iw'))?'he':'en';}
function guessPreset(){let tz='';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone;}catch(_){}const k=Object.keys(PRESETS).find(x=>x!=='custom'&&PRESETS[x].tz===tz);return k||'amsterdam';}
function defaults(){const gk=guessPreset(),GP=PRESETS[gk];return {lang:detectLang(),selected:null,periods:[],settings:{minDays:5,include31:true,kavuaTimes:3,preset:gk,placeName:'',locationSet:false,lat:GP.lat,lon:GP.lon,tz:GP.tz,tzeit:40,dawnMin:0,beinonitBoth:true,status:'none',discreet:true}};}
function load(){try{const x=JSON.parse(localStorage.getItem(STORE));if(x&&x.settings){if(x.settings.minDays==null&&x.settings.minhag==='seph')x.settings.minDays=4;if(x.settings.placeName==='Amsterdam, Netherlands'&&x.settings.preset==='amsterdam')x.settings.placeName='';return Object.assign(defaults(),x,{settings:Object.assign(defaults().settings,x.settings)});}}catch(e){}return defaults();}
function save(){try{localStorage.setItem(STORE,JSON.stringify(S));}catch(e){}}
const t = k => (I18N[S.lang]&&I18N[S.lang][k]) || I18N.en[k] || k;
const $ = id => document.getElementById(id);
const gname = k => (S.lang==='he'?GL[k].h:GL[k].e);
const gdesc = k => (S.lang==='he'?GL[k].dh:GL[k].de);
const gid = (k,s) => k+'@'+s;
function qbtn(k,s){const id=gid(k,s);return `<button type="button" class="q" data-act="gloss" data-k="${id}" aria-expanded="${glossOpen[id]?'true':'false'}" aria-label="${esc(t('whatIs')+' '+gname(k))}">?</button>`;}
function gbox(k,s){const id=gid(k,s);return `<div class="gl" data-g="${id}" ${glossOpen[id]?'':'hidden'}><b>${esc(gname(k))}</b><div>${esc(gdesc(k))}</div><button type="button" class="ghost small" data-act="glossAll">${t('glossAllBtn')}</button></div>`;}
function glossaryHTML(){return `<details class="card" id="glossBox"><summary>${t('glossary')}</summary>${Object.keys(GL).map(k=>`<div class="gl-item"><b>${esc(gname(k))}</b><div>${esc(gdesc(k))}</div></div>`).join('')}</details>`;}
function guideHTML(){return `<div class="card guide"><h2>${t('guideTitle')}</h2><ol style="padding-inline-start:22px;margin:6px 0">${['g1','g2','g3','g4'].map(k=>`<li style="margin:6px 0">${t(k)}</li>`).join('')}</ol><button class="ghost small" data-act="hideGuide">${t('gHide')}</button></div>`;}
const pname = k => {const p=PRESETS[k];return p?((S&&S.lang==='he'&&p.h)?p.h:p.n):'';};
const esc = x => String(x).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtC = d => L.civilFormat(d,S.lang);
const fmtH = d => L.hebFormat(d,S.lang);
function sunsetFor(d){ // civil Date -> {local:'HH:MM', tzeit:'HH:MM'} or null
  const s=S.settings;const ss=L.sunsetUTC(L.toISO(d),+s.lat,+s.lon);
  if(!ss)return null;
  return {local:L.fmtTime(ss,s.tz,'en'),tzeit:L.fmtTime(new Date(ss.getTime()+(+s.tzeit||0)*60000),s.tz,'en'),utc:ss};
}
function sorted(){return L.sortedPeriods(S.periods);}
function sel(){const l=sorted();if(!l.length)return -1;let i=l.findIndex(p=>p.id===S.selected);return i<0?l.length-1:i;}

function tzOffsetHours(tz,date){
  const parts=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'}).formatToParts(date);
  const g=k=>+parts.find(p=>p.type===k).value;
  return (Date.UTC(g('year'),g('month')-1,g('day'),g('hour'),g('minute'),g('second'))-Math.floor(date.getTime()/1000)*1000)/3600000;
}
function tzLooksWrong(lon,tz){
  try{return Math.abs(tzOffsetHours(tz,new Date())-(+lon)/15)>3.2;}catch(_){return false;}
}
function locationCardHTML(){
  const s=S.settings;
  const place=s.placeName==='@gps'?t('placeGps'):(s.placeName||((PRESETS[s.preset]&&s.preset!=='custom')?pname(s.preset):t('placeCoords')));
  let todayISO;try{todayISO=new Intl.DateTimeFormat('en-CA',{timeZone:s.tz}).format(new Date());}catch(_){todayISO=L.toISO(new Date());}
  const sr=L.sunriseUTC(todayISO,+s.lat,+s.lon), ss=L.sunsetUTC(todayISO,+s.lat,+s.lon);
  const f=(d,off)=>d?L.fmtTime(new Date(d.getTime()+off*60000),s.tz,'en'):'—';
  let h=`<div class="card"><h2>${t('location')}</h2>`;
  if(!s.locationSet)h+=`<div class="warn">${esc(t('locNotSet').replace('{place}',place))}</div>`;
  if(tzLooksWrong(s.lon,s.tz))h+=`<div class="warn">${esc(t('tzMismatch').replace('{tz}',s.tz))}</div>`;
  h+=`<div class="v">${esc(place)}</div><div class="sub"><span dir="ltr">${(+s.lat).toFixed(3)}, ${(+s.lon).toFixed(3)} · ${esc(s.tz)}</span></div>`;
  h+=`<div class="sub times">${t('todayTimes')}: ${(+s.dawnMin||0)>0?t('dawnL')+' '+f(sr,-(+s.dawnMin))+' · ':''}${t('sunriseL')} ${f(sr,0)} · ${t('sunsetL')} ${f(ss,0)} · ${t('nightfallL')} ${f(ss,+s.tzeit||0)}</div>`;
  h+=`<div class="sub">${t('dayNightHelp')} ${qbtn('sunset','loc')}${qbtn('bein','loc')}</div>${gbox('sunset','loc')}${gbox('bein','loc')}`;
  h+=`<div class="row" style="align-items:end"><div style="flex:3"><label for="locQuery">${t('locSearchLabel')}</label><input type="text" id="locQuery" autocomplete="off" placeholder="${esc(t('locSearchPh'))}" value="${esc(locQueryText)}"></div><div style="flex:0 0 auto;min-width:0"><button data-act="locSearch">${t('locSearch')}</button></div></div>`;
  if(locMsg)h+=`<div class="sub" style="margin-top:6px">${esc(locMsg)}</div>`;
  locResults.forEach((r,i)=>{h+=`<button class="ghost res" data-act="locPick" data-i="${i}">${esc([r.name,r.admin,r.country].filter(Boolean).join(', '))} <span class="k">(${r.lat.toFixed(2)}, ${r.lon.toFixed(2)})</span></button>`;});
  h+=`<p style="margin:10px 0 4px"><button class="ghost small" data-act="gps">${t('gps')}</button></p>`;
  h+=`<details id="coordsBox" ${locCoordsOpen?'open':''}><summary>${t('coords')}</summary>
    <div class="row"><div><label for="lat">${t('lat')}</label><input type="number" step="any" id="lat" value="${s.lat}"></div><div><label for="lon">${t('lon')}</label><input type="number" step="any" id="lon" value="${s.lon}"></div><div><label for="tz">${t('tz')}</label><input type="text" id="tz" value="${esc(s.tz)}"></div></div>
    <label for="preset">${t('common')}</label><select id="preset"><option value="">—</option>${Object.keys(PRESETS).filter(k=>k!=='custom').map(k=>`<option value="${k}">${esc(pname(k))}</option>`).join('')}</select></details>`;
  h+=`<div class="k" style="margin-top:8px">${t('locPrivacy')}</div></div>`;
  return h;
}
async function doSearch(){
  const el=$('locQuery');const q=((el&&el.value)||locQueryText||'').trim();locQueryText=q;
  if(q.length<2)return;
  locMsg=t('searching');locResults=[];render();
  try{
    const ctl=(typeof AbortController!=='undefined')?new AbortController():null;
    const timer=ctl?setTimeout(()=>ctl.abort(),10000):null;
    const lang=S.lang==='he'?'he':'en';
    const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=8&language='+lang+'&format=json',ctl?{signal:ctl.signal}:{});
    if(timer)clearTimeout(timer);
    if(!r.ok)throw new Error('http '+r.status);
    const j=await r.json();
    locResults=(j.results||[]).filter(x=>isFinite(x.latitude)&&isFinite(x.longitude)).map(x=>({name:x.name||'',admin:x.admin1||'',country:x.country||'',lat:+x.latitude,lon:+x.longitude,tz:x.timezone||''}));
    locMsg=locResults.length?'':t('noResults');
  }catch(e){locResults=[];locMsg=t('searchFail');}
  render();
}
function render(){
  const he=S.lang==='he';
  document.title=t('title');
  document.documentElement.lang=S.lang;document.documentElement.dir=he?'rtl':'ltr';
  const s=S.settings, list=sorted(), si=sel();
  let h='';
  h+=`<header><h1>${t('title')} ${qbtn('niddah','h')}</h1><div class="lang"><button class="ghost small" data-act="lang" data-v="${he?'en':'he'}">${he?'English':'עברית'}</button></div></header>${gbox('niddah','h')}`;
  h+=`<div class="disc">${t('disc')} ${t('stain')} ${qbtn('ketem','d')}${qbtn('rav','d')}<br><span class="k">${t('privacy')}</span></div>${gbox('ketem','d')}${gbox('rav','d')}`;
  if(!S.hideGuide)h+=guideHTML();

  h+=locationCardHTML();
  // new period
  const today=L.toISO(new Date(new Date().getTime()));
  h+=`<div class="card"><h2>${t('newPeriod')}</h2>
   <div class="row"><div><label for="onsetDate">${t('onsetDate')}</label><input type="date" id="onsetDate" value="${today}"></div>
   <div><label for="onsetTime">${t('onsetTime')}</label><input type="time" id="onsetTime"></div></div>
   <div class="seg"><label><input type="radio" name="onah" value="day" checked> ${t('onahDay')}</label><label><input type="radio" name="onah" value="bein"> ${t('onahBein')}</label><label><input type="radio" name="onah" value="night"> ${t('onahNight')}</label></div>
   <div class="sub">${t('helpWords')} ${qbtn('bein','np')}${qbtn('day','np')}</div>${gbox('bein','np')}${gbox('day','np')}
   <div id="msg" class="sub"></div>
   <p><button data-act="add">${t('calc')}</button></p></div>`;

  // results
  if(si>=0){
    const p=list[si];
    h+=resultsHTML(p,si,list);
  }

  // history
  h+=`<div class="card"><h2>${t('history')}</h2>`;
  if(!list.length)h+=`<div class="sub">${t('none')}</div>`;
  list.slice().reverse().forEach(p=>{
    const hd=L.halachicDate(p);const idx=list.indexOf(p);
    h+=`<div class="hist ${idx===si?'sel':''}"><div>${fmtC(L.parseISO(p.onsetISO))} · ${p.night?t('nightOnah'):(p.bein?t('beinOnah'):t('dayOnah'))}<div class="sub">${fmtH(hd)}</div></div><div><button class="ghost small" data-act="view" data-id="${p.id}">${t('view')}</button> <button class="danger small" data-act="del" data-id="${p.id}">${t('del')}</button></div></div>`;
  });
  if(list.length){h+=`<p style="margin-top:12px"><label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="discreet" ${s.discreet?'checked':''}> ${t('discreet')}</label><button class="ghost" data-act="ics">${t('export')}</button></p>`;}
  h+=`</div>`;

  h+=glossaryHTML();
  // settings
  h+=`<details class="card" id="settingsBox"><summary>${t('settings')}</summary>
   <label for="minDays">${t('minDays')} ${qbtn('fiveDays','s')}${qbtn('minhag','s')}</label>${gbox('fiveDays','s')}${gbox('minhag','s')}<select id="minDays">${[5,4,6,7].map(n=>`<option value="${n}" ${(+s.minDays||5)===n?'selected':''}>${t('d'+n)}</option>`).join('')}</select>
   <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="inc31" ${s.include31?'checked':''}> ${t('include31')}</label>
   <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="incBoth" ${s.beinonitBoth!==false?'checked':''}> ${t('beinonitBoth')}</label>
   <label for="kt">${t('kavuaTimes')}</label><input type="number" id="kt" min="2" max="5" value="${s.kavuaTimes}">
   <label for="status">${t('status')}</label><select id="status">${[['none','sNone'],['preg1','sPreg1'],['preg','sPreg'],['nurs','sNurs'],['nurs2','sNurs2'],['post','sPost'],['old','sOld']].map(([v,k])=>`<option value="${v}" ${s.status===v?'selected':''}>${t(k)}</option>`).join('')}</select>
   <label for="tzeit">${t('tzeit')}</label><input type="number" id="tzeit" min="0" max="120" value="${s.tzeit}">
   <label for="dawnMin">${t('dawnMin')}</label><input type="number" id="dawnMin" min="0" max="120" value="${s.dawnMin}">
   ${S.hideGuide?`<p><button class="ghost small" data-act="showGuide">${t('gShow')}</button></p>`:''}
   <p><button class="danger small" data-act="clear">${t('clear')}</button></p></details>`;
  h+=`<div class="foot">${t('rule')}${t('ruleN').replace('{n}',+s.minDays||5)}<br>${t('source')}</div>`;
  $('app').innerHTML=h;
}

function onahLine(date,o){
  const thr=t((+S.settings.dawnMin||0)>0?'throughDawn':'through');
  if(o==='both'){const st=L.onahStartCivil(date,'both');return `${t('bothOnah')}: ${t('nightFrom')} ${fmtC(st)} ${t('untilSunset')} ${fmtC(date)} <span class="sub">(${fmtH(date)})</span>`;}
  if(o==='night'){const st=L.onahStartCivil(date,'night');return `${t('nightOnah')}: ${t('nightFrom')} ${fmtC(st)} ${thr} <span class="sub">(${fmtH(date)})</span>`;}
  return `${t('dayOnah')}: ${fmtC(date)} <span class="sub">(${fmtH(date)})</span>`;
}

function checklistHTML(){
  return `<details class="card"><summary>${t('checklist')}</summary><ul style="padding-inline-start:20px;margin:8px 0 0">${['c1','c2','c3','c4','c5','c6','c7'].map(k=>`<li style="margin:6px 0">${t(k)}</li>`).join('')}</ul></details>`;
}
function resultsHTML(p,si,list){
  const s=S.settings;
  const plan=L.purityPlan(p,+s.minDays||5);
  let h=`<div class="card"><h2>${t('results')}</h2>`;
  plan.warnings.forEach(w=>{

function calGem(n){

function calEvents(list,si,plan){

  const onahName=q=>q.night?t('nightOnah'):(q.bein?t('beinOnah'):t('dayOnah'));
  list.forEach(q=>add(L.parseISO(q.onsetISO),'period',`${t('calPeriod')} · ${onahName(q)}`));

  if(p.hefsekISO)add(plan.hefsek,'hefsek',t('calHefsek')+(p.hefsekAfterSunset?' ('+t('hefsekAfter')+')':''));

function crc32(buf){if(!crc32.t){crc32.t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;crc32.t[n]=c>>>0;}}let crc=-1;for(let i=0;i<buf.length;i++)crc=crc32.t[(crc^buf[i])&255]^(crc>>>8);return(crc^-1)>>>0;}

  });
  const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${b}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="708" w:footer="708" w:gutter="0"/>${rtl?'<w:bidi/>':''}</w:sectPr></w:body></w:document>`;
  const ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>';
  const rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';
  return zipStore([{name:'[Content_Types].xml',data:ct},{name:'_rels/.rels',data:rels},{name:'word/document.xml',data:doc}],'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
}
if(window.addEventListener)window.addEventListener('afterprint',()=>{const r=$('report');if(r)r.innerHTML='';document.title=t('title');});

const STATUS_NOTE={preg1:'nPreg1',preg:'nPreg',nurs:'nNurs',nurs2:'nNurs2',post:'nPost',old:'nOld'};
// Onot to show for the selected period, by special status (sefer ch.23). null = hidden.
function onotFor(si){
  const st=S.settings.status;
  if(st==='preg'||st==='nurs'||st==='post'||st==='old')return null;
  const on=L.projectOnot(S.periods,si,S.settings);
  return st==='preg1'?on.filter(o=>/odesh/.test(o.kind)):on;
}

function buildICS(){
  const list=sorted(), si=sel(); if(si<0)return '';
  const p=list[si], s=S.settings, plan=L.purityPlan(p,+s.minDays||5);
  const ev=[];
  const disc=s.discreet;
  ev.push([plan.hefsek,disc?t('evGeneric'):t('evHef')]);
  ev.push([plan.mikvahEvening,disc?t('evGeneric'):t('evMik')]);
  (onotFor(si)||[]).forEach(o=>ev.push([L.onahStartCivil(o.date,o.onah),disc?t('evGeneric'):t('evOn')+': '+t(o.kind)]));
  const ymd=d=>L.toISO(d).replace(/-/g,'');
  let out='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Niddah Calculator//EN\r\n';
  ev.forEach((e,i)=>{
    out+=`BEGIN:VEVENT\r\nUID:niddah-${p.id}-${i}@local\r\nDTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z\r\nDTSTART;VALUE=DATE:${ymd(e[0])}\r\nDTEND;VALUE=DATE:${ymd(L.addDays(e[0],1))}\r\nSUMMARY:${e[1].replace(/[,;]/g,' ')}\r\nEND:VEVENT\r\n`;
  });
  return out+'END:VCALENDAR\r\n';
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='lang'){S.lang=b.dataset.v;save();render();}
  else if(a==='add'){
    const d=$('onsetDate').value;if(!d){$('msg').textContent=t('needDate');return;}
    let v=document.querySelector('input[name=onah]:checked').value;
    let note='';
    let dd=d;
    const tm=$('onsetTime').value;
    if(tm){
      const ss=sunsetFor(L.parseISO(d));
      if(ss){
        const mins=x=>parseInt(x.slice(0,2),10)*60+parseInt(x.slice(3,5),10);
        const sr=L.sunriseUTC(d,+S.settings.lat,+S.settings.lon);
        const dawnLocal=sr?L.fmtTime(new Date(sr.getTime()-(+S.settings.dawnMin||0)*60000),S.settings.tz,'en'):null;
        if(dawnLocal&&tm<dawnLocal){dd=L.toISO(L.addDays(L.parseISO(d),-1));v='night';note=t('autoPre');}
        else{
          const m=mins(tm),s0=mins(ss.local);
          if(m<s0){v='day';note=t('autoDay');}
          else if(m<=s0+L.BEIN_MIN){v='bein';note=t('autoBein');}
          else{v='night';note=t('autoNight');}
        }
      }else note=t('noSunset');
    }
    const id=String(Date.now());
    S.periods.push({id,onsetISO:dd,night:v==='night',bein:v==='bein'});S.selected=id;save();render();
    if(note)$('msg').textContent=note;
    window.scrollTo({top:0,behavior:'smooth'});
  }
  else if(a==='view'){S.selected=b.dataset.id;save();render();window.scrollTo({top:0,behavior:'smooth'});}
  else if(a==='del'){if(confirm(t('confirmDel'))){S.periods=S.periods.filter(p=>p.id!==b.dataset.id);if(S.selected===b.dataset.id)S.selected=null;save();render();}}
  else if(a==='hefsek'){const p=S.periods.find(x=>x.id===b.dataset.id);if(p){p.hefsekISO=$('hefsekDate').value||undefined;p.hefsekAfterSunset=$('hefsekAfter').checked;save();render();}}
  else if(a==='clear'){if(confirm(t('confirmClear'))){S=defaults();save();render();}}
  else if(a==='gloss'){
    const id=b.dataset.k;glossOpen[id]=!glossOpen[id];
    document.querySelectorAll('[data-g="'+id+'"]').forEach(el=>{el.hidden=!glossOpen[id];});
    document.querySelectorAll('button.q[data-k="'+id+'"]').forEach(el=>el.setAttribute('aria-expanded',glossOpen[id]?'true':'false'));
  }
  else if(a==='glossAll'){const g=$('glossBox');if(g){g.open=true;if(g.scrollIntoView)g.scrollIntoView({behavior:'smooth',block:'start'});}}
  else if(a==='hideGuide'){S.hideGuide=true;save();render();}
  else if(a==='showGuide'){S.hideGuide=false;save();render();window.scrollTo({top:0,behavior:'smooth'});}
  else if(a==='locSearch'){doSearch();}
  else if(a==='locPick'){
    const r=locResults[+b.dataset.i];if(!r)return;
    const s=S.settings;s.lat=+r.lat.toFixed(4);s.lon=+r.lon.toFixed(4);
    let tz=r.tz;
    try{new Intl.DateTimeFormat('en',{timeZone:tz});}catch(_){try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone;}catch(__){tz='UTC';}}
    s.tz=tz||'UTC';
    s.placeName=[r.name,r.admin,r.country].filter(Boolean).join(', ');
    s.preset='custom';s.locationSet=true;locResults=[];locMsg='';save();render();
  }
  else if(a==='gps'){
    if(!navigator.geolocation){locMsg=t('gpsFail');render();return;}
    navigator.geolocation.getCurrentPosition(pos=>{
      const s=S.settings;s.preset='custom';s.lat=+pos.coords.latitude.toFixed(4);s.lon=+pos.coords.longitude.toFixed(4);
      try{s.tz=Intl.DateTimeFormat().resolvedOptions().timeZone||s.tz;}catch(_){}
      s.placeName='@gps';s.locationSet=true;locResults=[];locMsg='';save();render();
    },()=>{locMsg=t('gpsFail');render();});
  }
  else if(a==='calPrev'||a==='calNext'){if(!calMonth)return;calMonth.m+=a==='calNext'?1:-1;if(calMonth.m<0){calMonth.m=11;calMonth.y--;}if(calMonth.m>11){calMonth.m=0;calMonth.y++;}calRefresh();}
  else if(a==='calToday'){let ti;try{ti=new Intl.DateTimeFormat('en-CA',{timeZone:S.settings.tz}).format(new Date());}catch(_){ti=L.toISO(new Date());}const d=L.parseISO(ti);calMonth={y:d.getUTCFullYear(),m:d.getUTCMonth()};calSel=ti;calRefresh();}
  else if(a==='calDay'){calSel=b.dataset.iso;calRefresh();}
  else if(a==='repPdf'){
    const m=reportModel(repShort);if(!m)return;
    const r=$('report');r.dir=S.lang==='he'?'rtl':'ltr';r.lang=S.lang;r.innerHTML=reportHTML(m);
    document.title=m.title;window.print();
  }
  else if(a==='repDocx'){
    const m=reportModel(repShort);if(!m)return;
    const url=URL.createObjectURL(buildDocx(m));
    const el=document.createElement('a');el.href=url;el.download='niddah-report.docx';document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  else if(a==='ics'){
    const txt=buildICS();if(!txt)return;
    const url=URL.createObjectURL(new Blob([txt],{type:'text/calendar'}));
    const el=document.createElement('a');el.href=url;el.download='reminders.ics';document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
});

document.addEventListener('change',e=>{
  const id=e.target.id, s=S.settings;
  let reopen=true;
  if(id==='minDays')s.minDays=+e.target.value;
  else if(id==='inc31')s.include31=e.target.checked;
  else if(id==='incBoth')s.beinonitBoth=e.target.checked;
  else if(id==='kt')s.kavuaTimes=Math.max(2,Math.min(5,+e.target.value||3));
  else if(id==='status')s.status=e.target.value;
  else if(id==='preset'){const p=PRESETS[e.target.value];reopen=false;if(p){s.lat=p.lat;s.lon=p.lon;s.tz=p.tz;s.placeName='';s.preset=e.target.value;s.locationSet=true;locResults=[];locMsg='';}}
  else if(id==='lat'||id==='lon'){
    reopen=false;
    const la=id==='lat'?parseFloat(e.target.value):+s.lat, lo=id==='lon'?parseFloat(e.target.value):+s.lon;
    if(!(la>=-90&&la<=90&&lo>=-180&&lo<=180)){locMsg=t('badCoords');save();render();return;}
    s.lat=la;s.lon=lo;s.preset='custom';s.placeName='';s.locationSet=true;locMsg=t('checkTz').replace('{tz}',s.tz);
  }
  else if(id==='tz'){reopen=false;s.tz=e.target.value.trim()||'UTC';s.preset='custom';s.locationSet=true;}
  else if(id==='tzeit')s.tzeit=+e.target.value||0;
  else if(id==='dawnMin')s.dawnMin=Math.max(0,+e.target.value||0);
  else if(id==='discreet'){s.discreet=e.target.checked;save();return;}
  else if(id==='repShort'){repShort=e.target.checked;return;}
  else return;
  // validate tz
  try{new Intl.DateTimeFormat('en',{timeZone:s.tz});}catch(_){s.tz='UTC';locMsg=t('badTz');}
  save();render();
  if(reopen){const det=$('settingsBox');if(det)det.open=true;}
});

document.addEventListener('input',e=>{if(e.target&&e.target.id==='locQuery')locQueryText=e.target.value;});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='locQuery'){e.preventDefault();doSearch();}});
document.addEventListener('toggle',e=>{if(e.target&&e.target.id==='coordsBox')locCoordsOpen=e.target.open;},true);

render();
})();
</script>
